<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />

    <!-- iOS PWA — installable, fullscreen, status bar style follows theme. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Core" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Android / Chrome PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf6" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Core</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
